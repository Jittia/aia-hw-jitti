# Layer 1 scoring settings. Tuned on Day 4 by the backtest; every change is logged in prompts.md.

universe_date: "2026-11-02"
top_n: 100                     # Layer 1 output size, handed to Layer 2 (AI reads filings)

# Gate: quant proof first (spec.md). A company must show growth or a turnaround to be ranked.
gate:
  min_rev_growth: 0.0          # TTM revenue YoY must be >= this ...
  allow_turnaround: true       # ... unless operating income or FCF just turned positive
  min_rev_ttm_usd: 5_000_000   # below this, % changes are noise

# Weights on percentile ranks (0–1). Missing value = 0.5 (neutral). Must sum to 1.
# Day 4 backtest (output/backtest_report.md). Companies under $300M were ~10x more likely to 10x.
# "plausibility" (required CAGR at an exit P/S) mostly rewards cheap stocks, not small ones, so an
# explicit small_size rank was added. Chosen by Jitti: size .15 / plausibility .30 = balanced
# (+1 ten-bagger in both windows vs no size tilt, at the cost of a few more halved stocks).
# Day 3 weights were 0.20/0.20/0.10/0.15/0.10/0.05/0.20 (growth/accel/gm/om/turn/dilution/plaus).
weights:
  rev_growth: 0.15
  rev_accel: 0.15
  gm_delta: 0.05
  om_delta: 0.10
  turnaround: 0.05             # binary 0/1, not ranked
  low_dilution: 0.05           # rank of −share_growth
  plausibility: 0.30           # rank of −required revenue CAGR (cheapness vs sector exit P/S)
  small_size: 0.15             # rank of −market cap
  rev_new_high: 0.0            # rank of rev_vs_peak; backtest inconclusive (helped holdout, hurt tune)

# Score multipliers for red flags (ASSUMPTION thresholds, tune on Day 4).
penalties:
  dilution_above: 0.25         # diluted shares up > 25% in a year ...
  dilution_multiplier: 0.7
  lumpy_q_share_above: 0.5     # one quarter > 50% of TTM revenue (milestone / one-off) ...
  lumpy_multiplier: 0.7
  # Acquisition-driven growth (Day 5): cash paid for acquisitions (8 quarters) OR goodwill added (~2 years),
  # each as a share of revenue a year ago. Calibrated on Layer 2 labels: catches 15/21 inorganic, 2 false flags.
  acquisitive_cash_above: 0.10
  acquisitive_goodwill_above: 0.10
  acquisitive_multiplier: 0.6  # ASSUMPTION, checked in the backtest

# 10x plausibility (soft size penalty, spec.md material question 3).
# Required 5-year revenue CAGR so that revenue × exit P/S = 10 × today's market cap.
# Exit P/S by sector is an ASSUMPTION (not sourced); revisit after the backtest.
plausibility:
  years: 5
  exit_ps_default: 3.0
  exit_ps_by_sector:
    Technology: 6.0
    Healthcare: 5.0
    Communication Services: 4.0
    Financials: 4.0
    Real Estate: 4.0
    Industrials: 2.5
    Consumer Discretionary: 2.0
    Materials: 2.0
    Consumer Staples: 1.5
    Energy: 1.5
    Utilities: 2.0
  mega_end_cap_usd: 1_000_000_000_000   # 10x would end above $1T ...
  mega_multiplier: 0.5                  # ... so the total score is halved

# ---------------------------------------------------------------------------------------------
# Phase 1.5 radar (spec.md v2). Thresholds marked ASSUMPTION are starting points; they are tuned
# on events known 2012–2017 and reported on 2018–2021 (holdout) by src/event_study.py.
radar:
  target_multiple: 5           # success = ≥5x total return within horizon_years
  stretch_multiple: 10         # names whose story could stretch to 10x get a flag
  horizon_years: 5
  study:
    start: "2012-12-31"        # first known_date counted
    tune_end: "2017-12-31"     # thresholds chosen on events up to here ...
    end: "2021-10-31"          # ... holdout runs to here (needs 5 years of prices after)
  min_rev_ttm_usd: 5_000_000   # below this, % changes are noise
  events:
    rev_accel_pp: 0.10         # quarterly YoY growth up ≥10 pp vs 2 quarters earlier ... (ASSUMPTION)
    rev_accel_min_growth: 0.15 # ... and at least +15% YoY
    gm_step_pp: 0.03           # TTM gross margin ≥ +3 pp YoY (ASSUMPTION)
    contracted_jump: 0.30      # RPO or contract liabilities ≥ +30% YoY (ASSUMPTION)
    insider_min_buyers: 2      # ≥2 different insiders buying in the open market ...
    insider_window_days: 90    # ... within 90 days
  # Event types that can put a company on Radar. Chosen on the TUNING window only (2012–2017 lift ≥ 1.2):
  # rev_accel 1.45, gm_step 1.39, turn_positive 1.33, contract_jump 1.79. Dropped: officer_change 1.03,
  # material_deal 0.96, insider_cluster 1.01 (holdout 1.37, but the holdout may not be used to choose).
  # Dropped types still show in each company's event timeline as context.
  radar_events: [rev_accel, gm_step, turn_positive, contract_jump]
  stages:
    # Set BEFORE seeing results and kept: the grid's tune-best (excess ≥30%) fell to 1.26x lift on the holdout,
    # while these a-priori values give Confirmed 1.68x / Emerging 1.43x on the holdout (event_study_report.md).
    industry_excess_pp: 0.10   # Emerging: TTM growth beats the industry median by ≥10 pp (ASSUMPTION)
    max_required_cagr: 0.60    # Emerging: 5x must need ≤60%/yr revenue growth at the sector exit P/S (ASSUMPTION)
    confirm_quarters: 2        # Confirmed = Emerging in this many consecutive quarters
    max_dilution: 0.25         # Broken if diluted shares rise more than this in a year
