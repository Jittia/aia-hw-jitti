# Layer 1 scoring settings. Tuned on Day 4 by the backtest; every change is logged in prompts.md.

universe_date: "2026-11-02"
top_n: 100                     # Layer 1 output size, handed to Layer 2 (AI reads filings)

# Gate: quant proof first (spec.md). A company must show growth or a turnaround to be ranked.
gate:
  min_rev_growth: 0.0          # TTM revenue YoY must be >= this ...
  allow_turnaround: true       # ... unless operating income or FCF just turned positive
  min_rev_ttm_usd: 5_000_000   # below this, % changes are noise

# Weights on percentile ranks (0–1). Missing value = 0.5 (neutral). Must sum to 1.
# Day 4 backtest (output/backtest_report.md). Companies under $300M were ~10x more likely to 10x.
# "plausibility" (required CAGR at an exit P/S) mostly rewards cheap stocks, not small ones, so an
# explicit small_size rank was added. Chosen by Jitti: size .15 / plausibility .30 = balanced
# (+1 ten-bagger in both windows vs no size tilt, at the cost of a few more halved stocks).
# Day 3 weights were 0.20/0.20/0.10/0.15/0.10/0.05/0.20 (growth/accel/gm/om/turn/dilution/plaus).
weights:
  rev_growth: 0.15
  rev_accel: 0.15
  gm_delta: 0.05
  om_delta: 0.10
  turnaround: 0.05             # binary 0/1, not ranked
  low_dilution: 0.05           # rank of −share_growth
  plausibility: 0.30           # rank of −required revenue CAGR (cheapness vs sector exit P/S)
  small_size: 0.15             # rank of −market cap
  rev_new_high: 0.0            # rank of rev_vs_peak; backtest inconclusive (helped holdout, hurt tune)

# Score multipliers for red flags (ASSUMPTION thresholds, tune on Day 4).
penalties:
  dilution_above: 0.25         # diluted shares up > 25% in a year ...
  dilution_multiplier: 0.7
  lumpy_q_share_above: 0.5     # one quarter > 50% of TTM revenue (milestone / one-off) ...
  lumpy_multiplier: 0.7

# 10x plausibility (soft size penalty, spec.md material question 3).
# Required 5-year revenue CAGR so that revenue × exit P/S = 10 × today's market cap.
# Exit P/S by sector is an ASSUMPTION (not sourced); revisit after the backtest.
plausibility:
  years: 5
  exit_ps_default: 3.0
  exit_ps_by_sector:
    Technology: 6.0
    Healthcare: 5.0
    Communication Services: 4.0
    Financials: 4.0
    Real Estate: 4.0
    Industrials: 2.5
    Consumer Discretionary: 2.0
    Materials: 2.0
    Consumer Staples: 1.5
    Energy: 1.5
    Utilities: 2.0
  mega_end_cap_usd: 1_000_000_000_000   # 10x would end above $1T ...
  mega_multiplier: 0.5                  # ... so the total score is halved
